
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LifeQuest RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#050914', // Deeper dark
              surface: '#0f172a',
              primary: '#3b82f6', // Electric Blue
              secondary: '#10b981', // Emerald
              accent: '#f43f5e', // Rose
              hud: '#0ea5e9', // Sky
            },
            fontFamily: {
              sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'slide-in': 'slideIn 0.3s ease-out forwards',
              'scale-up': 'scaleUp 0.2s ease-out forwards',
              'text-focus-in': 'text-focus-in 0.5s cubic-bezier(0.550, 0.085, 0.680, 0.530) both',
              'subtle-pulse': 'subtle-pulse 2s infinite',
            },
            keyframes: {
              glow: {
                '0%': { boxShadow: '0 0 5px rgba(59, 130, 246, 0.2)' },
                '100%': { boxShadow: '0 0 20px rgba(59, 130, 246, 0.6), 0 0 10px rgba(59, 130, 246, 0.4)' },
              },
              slideIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleUp: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'text-focus-in': {
                '0%': { filter: 'blur(12px)', opacity: '0' },
                '100%': { filter: 'blur(0px)', opacity: '1' },
              },
              'subtle-pulse': {
                '0%, 100%': { transform: 'scale(1)', opacity: '1' },
                '50%': { transform: 'scale(1.02)', opacity: '0.95' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050914;
        color: #e2e8f0;
        overflow: hidden; /* Prevent body scroll, handle in app */
      }

      /* Cyberpunk/System Grid Background */
      .bg-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(30, 58, 138, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(30, 58, 138, 0.05) 1px, transparent 1px);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
        pointer-events: none;
      }

      /* Vignette */
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: 0 0 150px rgba(0,0,0,0.9) inset;
        z-index: -1;
        pointer-events: none;
      }

      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #050914;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }
      
      /* Custom horizontal scrollbar */
      .custom-scrollbar-horizontal::-webkit-scrollbar {
        height: 6px;
      }
      .custom-scrollbar-horizontal::-webkit-scrollbar-track {
        background: #050914;
        border-radius: 3px;
      }
      .custom-scrollbar-horizontal::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }
      .custom-scrollbar-horizontal::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }


      /* Utility for mobile bottom safe area */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      /* Text Glow Utilities */
      .text-shadow-glow {
        text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
      }
      .text-shadow-red {
        text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
      }
      .text-shadow-gold {
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^11.3.19"
  }
}
</script>
</head>
  <body>
    <div class="bg-grid"></div>
    <div class="vignette"></div>
    <div id="root"></div>
  </body>
</html>
